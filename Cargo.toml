[package]
name = "urashyl-portfolio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Portfolio web server for urashyl.dev built with Rust and Axum"
license = "MIT"
readme = "README.md"
homepage = "https://urashyl.dev"
repository = "https://github.com/urashyl/urashyl.dev"
keywords = ["portfolio", "axum", "grafana", "proxmox", "homelab"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
maud = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
